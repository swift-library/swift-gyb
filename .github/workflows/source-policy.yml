name: Source policy
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
jobs:
  policy:
    uses: swift-library/github-workflows/.github/workflows/policy.yml@5dd95c4ee515c667abaea2dc5426e8ef93e88784
