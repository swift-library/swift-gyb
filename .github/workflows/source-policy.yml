name: Source policy
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
jobs:
  policy:
    uses: swift-library/github-workflows/.github/workflows/policy.yml@13b7e934da06a98f1b4ee11bd09cba85c84f458c
