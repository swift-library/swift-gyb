name: CI
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
jobs:
  validate:
    uses: swift-library/github-workflows/.github/workflows/swift-package.yml@bfefb3396d2a9ed892cf5e72054a3e2a9ad10f11
