name: CI
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    uses: swift-library/.github/.github/workflows/policy.yml@bb9aa049802360109e94cef395f7f9e1245c1b4a
  validate:
    uses: swift-library/.github/.github/workflows/swift-package-ci.yml@bb9aa049802360109e94cef395f7f9e1245c1b4a
