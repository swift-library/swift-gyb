name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain Versions
        run: |
          swift --version
          python3 --version

      - name: Verify GYB Script
        run: python3 gyb.artifactbundle/gyb.py --test

      - name: Run Tests
        run: swift test

  test-linux:
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-jammy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Python
        run: |
          if ! command -v python3 >/dev/null 2>&1; then
            apt-get update
            apt-get install -y python3
          fi
          python3 --version

      - name: Toolchain Version
        run: swift --version

      - name: Verify GYB Script
        run: python3 gyb.artifactbundle/gyb.py --test

      - name: Run Tests
        run: swift test
