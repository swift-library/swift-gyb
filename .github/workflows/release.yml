name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    uses: swift-library/github-workflows/.github/workflows/swift-package.yml@13b7e934da06a98f1b4ee11bd09cba85c84f458c
  release:
    needs: validate
    permissions:
      contents: write
      actions: read
    uses: swift-library/github-workflows/.github/workflows/swift-package-release.yml@13b7e934da06a98f1b4ee11bd09cba85c84f458c
    with:
      tag: ${{ github.ref_name }}
      accepted_commit: ${{ github.sha }}
