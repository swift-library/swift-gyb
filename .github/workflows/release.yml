name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    uses: swift-library/github-workflows/.github/workflows/swift-package.yml@780ee5a8150d1088ac4256862bdadab632f89912
  release:
    needs: validate
    permissions:
      contents: write
      actions: read
    uses: swift-library/github-workflows/.github/workflows/swift-package-release.yml@780ee5a8150d1088ac4256862bdadab632f89912
    with:
      tag: ${{ github.ref_name }}
      accepted_commit: ${{ github.sha }}
