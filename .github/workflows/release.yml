name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
jobs:
  validate:
    uses: swift-library/github-workflows/.github/workflows/swift-package.yml@0d016c87e9631d5c6ecdc781226d843aaec22e71
  release:
    needs: validate
    permissions:
      contents: write
      actions: read
    uses: swift-library/github-workflows/.github/workflows/swift-package-release.yml@0d016c87e9631d5c6ecdc781226d843aaec22e71
    with:
      tag: ${{ github.ref_name }}
      accepted_commit: ${{ github.sha }}
